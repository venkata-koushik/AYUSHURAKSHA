<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consultation Request</title>
  <style>
    body{margin:0;font-family:Segoe UI,Tahoma,sans-serif;background:#eef3fb;color:#173451}
    .page{max-width:1100px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 380px;gap:14px}
    .card{background:#fff;border:1px solid #d6e4f6;border-radius:14px;padding:14px;box-shadow:0 10px 20px rgba(16,56,98,.1)}
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .back{padding:8px 12px;border-radius:10px;background:#edf2ff;text-decoration:none;color:#2d3f78}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    input,select,textarea{width:100%;padding:11px;border:1px solid #cadbf0;border-radius:10px;font-family:inherit}
    button{padding:12px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
    .primary{background:linear-gradient(120deg,#1E5DA8,#2D7BE5);color:#fff}
    .soft{background:#f3f8ff;color:#1f4d88;border:1px solid #c8dbf4}
    .side{display:flex;flex-direction:column;gap:10px}
    .status{white-space:pre-wrap;background:#f8fbff;border:1px dashed #c8d9ef;border-radius:10px;padding:10px;min-height:70px;font-size:12px}
    .toast{position:fixed;right:14px;bottom:14px;background:#111827;color:#fff;padding:10px 12px;border-radius:10px;display:none;max-width:320px;box-shadow:0 10px 24px rgba(0,0,0,.24)}
    @media(max-width:980px){.page{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="top">
        <a class="back" href="/patient/dashboard">Back</a>
        <strong>Book Consultation With Senior Medical Student Consultant</strong>
      </div>
      <div class="grid">
        <div id="languageChecks" style="border:1px solid #cadbf0;border-radius:10px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px"></div>
        <input id="problem" placeholder="Problem summary" />
      </div>
      <textarea id="details" rows="6" style="margin-top:10px" placeholder="Describe symptoms clearly..."></textarea>
      <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
        <select id="consultMode" style="max-width:220px">
          <option value="chat" selected>Consultation Mode: Chat</option>
          <option value="video">Consultation Mode: Video</option>
        </select>
        <button id="connectNowBtn" class="primary" type="button">Connect Now</button>
      </div>
    </section>

    <aside class="card side">
      <strong>Consultation Actions</strong>
      <button id="openChatBtn" class="soft" type="button">Open Realtime Chat Page</button>
      <button id="joinVideoBtn" class="soft" type="button">Join Video Session</button>
      <div class="status" id="out"></div>
    </aside>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    localStorage.setItem("active_role", "patient");
    const patientId = localStorage.getItem("patient_id") || "";
    const patientToken = localStorage.getItem("patient_token") || "";
    const allLanguages = ['English','Hindi','Tamil','Telugu','Kannada','Malayalam','Marathi','Bengali'];
    const selectedLanguages = new Set((localStorage.getItem('patient_languages') || 'English').split(',').map(v=>v.trim()).filter(Boolean));
    const authHeaders = () => patientToken ? { "Authorization": "Bearer " + patientToken } : {};
    const show = (d) => { out.textContent = typeof d === "string" ? d : JSON.stringify(d, null, 2); console.log("patient-consult", d); };
    const toast = (m) => { const t = document.getElementById("toast"); t.textContent = m; t.style.display = "block"; setTimeout(()=>t.style.display="none", 2400); };
    const parse = async (res) => {
      const txt = await res.text();
      let data = {};
      try { data = txt ? JSON.parse(txt) : {}; } catch { data = { detail: txt || ("HTTP " + res.status) }; }
      if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : (txt || ("HTTP " + res.status)));
      return data;
    };
    async function getSessionStatus(sessionId){
      if (!sessionId) throw new Error("No active session.");
      return parse(await fetch('/api/session/status/' + encodeURIComponent(sessionId), { headers: { ...authHeaders() } }));
    }
    function renderLanguageChecks(){
      languageChecks.innerHTML = '';
      allLanguages.forEach((lang)=>{
        const id = 'pl_'+lang.toLowerCase();
        const row = document.createElement('label');
        row.style.display='flex'; row.style.gap='6px'; row.style.alignItems='center';
        row.innerHTML = `<input id="${id}" type="checkbox" ${selectedLanguages.has(lang)?'checked':''} />${lang}`;
        languageChecks.appendChild(row);
        row.querySelector('input').addEventListener('change',(ev)=>{
          if(ev.target.checked) selectedLanguages.add(lang); else selectedLanguages.delete(lang);
          localStorage.setItem('patient_languages', Array.from(selectedLanguages).join(','));
        });
      });
    }
    renderLanguageChecks();
    function selectedLanguageCsv(){
      if(!selectedLanguages.size) selectedLanguages.add('English');
      return Array.from(selectedLanguages).join(',');
    }
    function consultationProblem(){ return (problem.value.trim() || details.value.trim() || "General consultation"); }

    connectNowBtn.onclick = async () => {
      try {
        if(!patientId) throw new Error("Patient login required.");
        if(!patientToken) throw new Error("Patient auth token missing. Please login again.");
        connectNowBtn.disabled = true;
        connectNowBtn.textContent = "Searching...";
        const mode = (consultMode.value || "chat").toLowerCase() === "video" ? "video" : "chat";
        const d = await parse(await fetch('/api/session/connect-now', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ language: selectedLanguageCsv(), problem: consultationProblem(), mode }),
        }));
        show(d);
        if (!d.available) {
          toast("No Students Available");
          return;
        }
        if (d.session_id) {
          localStorage.setItem("session_id", d.session_id);
          localStorage.setItem("session_mode", (d.mode || mode));
          localStorage.setItem("active_role", "patient");
          toast("Request sent to available student.");
        }
      } catch (e) {
        show(e.message || String(e));
      } finally {
        connectNowBtn.disabled = false;
        connectNowBtn.textContent = "Connect Now";
      }
    };

    openChatBtn.onclick = () => {
      const sid = localStorage.getItem("session_id");
      if (!sid) { show("No active session. Request consultation first."); return; }
      getSessionStatus(sid).then((s) => {
        if ((s.status || "").toLowerCase() !== "active") {
          toast("Waiting for student acceptance.");
          show({ status: s.status, message: "Session is not active yet." });
          return;
        }
        location.href = "/session/chat?role=patient";
      }).catch((e) => show(e.message || String(e)));
    };

    joinVideoBtn.onclick = async () => {
      try {
        const sessionId = localStorage.getItem("session_id");
        if (!sessionId) throw new Error("No active session.");
        const s = await getSessionStatus(sessionId);
        if ((s.status || "").toLowerCase() !== "active") {
          toast("Waiting for student acceptance.");
          show({ status: s.status, message: "Session is not active yet." });
          return;
        }
        const d = await parse(await fetch("/api/session/video-join", {
          method:"POST", headers:{"Content-Type":"application/json", ...authHeaders()},
          body:JSON.stringify({ session_id: sessionId, requester_id: patientId })
        }));
        show(d);
        localStorage.setItem("session_mode", "video");
        location.href = "/session/video?role=patient";
      } catch (e) { show(e.message || String(e)); }
    };

    async function pollSessionStatus(){
      const sessionId = localStorage.getItem("session_id");
      if(!sessionId) return;
      try{
        const data = await parse(await fetch('/api/chat/recall/' + encodeURIComponent(sessionId)));
        if(data && data.session_id){
          console.log("session recall", data);
        }
      }catch{}
    }

    if (patientId) {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      let ws;
      const connect = () => {
        const tokenQ = encodeURIComponent(patientToken || "");
        ws = new WebSocket(`${proto}://${location.host}/ws/notifications/patient/${encodeURIComponent(patientId)}?token=${tokenQ}`);
        ws.onmessage = (evt) => {
          try{
            const p = JSON.parse(evt.data);
            if(p.message){ toast(p.message); show(p); }
            if(p.type === "session_update" && p.title && p.title.toLowerCase().includes("accepted")){
              const mode = (p.mode || localStorage.getItem("session_mode") || "chat").toLowerCase();
              localStorage.setItem("session_mode", mode);
              location.href = mode === "video" ? "/session/video?role=patient" : "/session/chat?role=patient";
            } else if (p.type === "session_update" && p.title && p.title.toLowerCase().includes("session ended")) {
              localStorage.removeItem("session_id");
              localStorage.removeItem("session_mode");
            }
          }catch{}
        };
        ws.onclose = () => setTimeout(connect, 1500);
      };
      connect();
      setInterval(pollSessionStatus, 8000);
    }
  </script>
</body>
</html>
