<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <style>
    :root{--pri:#334eea;--line:#d6def8}
    body{margin:0;font-family:Segoe UI,Tahoma,sans-serif;background:linear-gradient(145deg,#f5f7fb,#eef3ff)}
    .container{max-width:640px;margin:0 auto;padding:24px}
    .back{display:inline-block;margin-bottom:12px;padding:9px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);text-decoration:none;color:#22356f}
    .card{background:#fff;border-radius:16px;box-shadow:0 18px 36px rgba(32,53,121,.12);padding:20px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    input,select,button{padding:12px;border-radius:12px;font-size:14px}
    input,select{border:1px solid var(--line)}
    button{border:none;background:var(--pri);color:#fff;font-weight:700;cursor:pointer}
    .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
    .out{margin-top:12px;white-space:pre-wrap;background:#f7f9ff;border:1px dashed #c5d0f3;border-radius:12px;padding:10px}
    @media(max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="container">
    <a id="backLink" class="back" href="/select-role">Back</a>
    <section class="card">
      <h2>Reset Your Password</h2>
      <div class="grid">
        <select id="role">
          <option value="patient">User</option>
          <option value="doctor">Doctor</option>
          <option value="student">Senior Medical Student Consultant</option>
        </select>
        <select id="channel">
          <option value="email">Email OTP</option>
        </select>
        <input id="identifier" placeholder="Registered Email" />
        <input id="otp" placeholder="OTP" />
        <input id="new_password" type="password" placeholder="New Password" />
      </div>
      <div class="row">
        <button id="sendOtpBtn">Send OTP</button>
        <button id="resetBtn">Reset Password</button>
      </div>
      <pre id="out" class="out"></pre>
    </section>
  </main>
  <script>
    const qp = new URLSearchParams(location.search);
    const requestedRole = (qp.get("role") || "patient").toLowerCase();
    role.value = ["patient","doctor","student"].includes(requestedRole) ? requestedRole : "patient";
    channel.value = "email";
    channel.disabled = true;
    function loginRouteByRole(currentRole){
      return currentRole === "doctor" ? "/doctor/login" : (currentRole === "student" ? "/student/login" : "/patient/login");
    }
    backLink.href = loginRouteByRole(role.value);
    role.onchange = () => backLink.href = loginRouteByRole(role.value);

    const show = (d) => out.textContent = typeof d === "string" ? d : JSON.stringify(d, null, 2);
    async function read(res){
      const txt = await res.text();
      let data = {};
      try { data = txt ? JSON.parse(txt) : {}; } catch { data = { detail: txt || `HTTP ${res.status}` }; }
      if(!res.ok) throw new Error(data.detail || txt || `HTTP ${res.status}`);
      return data;
    }
    function validateIdentifierByChannel() {
      const id = identifier.value.trim();
      if (!id) throw new Error("Enter registered email.");
      if (!id.includes("@")) throw new Error("Enter a valid registered email.");
      return id;
    }
    function rememberResetPrefill() {
      const key = "reset_prefill_" + role.value;
      const payload = {
        role: role.value,
        identifier: identifier.value.trim(),
        password: new_password.value,
        at: Date.now(),
      };
      try { sessionStorage.setItem(key, JSON.stringify(payload)); } catch {}
    }

    sendOtpBtn.onclick = async () => {
      let id = "";
      try { id = validateIdentifierByChannel(); } catch (e) { return show(e.message || String(e)); }
      const r = await fetch("/api/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({identifier:id,channel:channel.value,role:role.value})});
      try { const d = await read(r); show(d); console.log("forgot-password otp sent", d); } catch (e) { show(e.message); }
    };
    resetBtn.onclick = async () => {
      let id = "";
      try { id = validateIdentifierByChannel(); } catch (e) { return show(e.message || String(e)); }
      if(!otp.value.trim() || !new_password.value.trim()) return show("Enter OTP and new password.");
      const body = {identifier:id,new_password:new_password.value.trim(),role:role.value,channel:channel.value,otp:otp.value.trim()};
      const r = await fetch("/api/patient/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      try {
        const d = await read(r);
        show(d);
        console.log("forgot-password reset done", d);
        rememberResetPrefill();
        const loginRoute = loginRouteByRole(role.value);
        location.replace(loginRoute + "?reset=1");
      } catch (e) {
        show((e.message || String(e)).includes("Invalid or expired OTP") ? "Invalid OTP" : (e.message || String(e)));
      }
    };
  </script>
</body>
</html>
